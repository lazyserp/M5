name: M5

services:
  # Qdrant Persistent Vector Database (Custom Port 16333)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: M5-qdrant
    restart: always
    ports:
      - "16333:6333"
      - "16334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  # Ollama Local LLM Model Engine (Custom Port 11435)
  ollama:
    image: ollama/ollama:latest
    container_name: M5-ollama
    restart: always
    ports:
      - "11435:11434"
    volumes:
      - ollama_storage:/root/.ollama

  #  Model Auto-Downloader (Pulls Model into Ollama on First Launch)
  ollama-pull-model:
    image: ollama/ollama:latest
    container_name: M5-ollama-pull
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - M5_OLLAMA_MODEL=${M5_OLLAMA_MODEL:-qwen2.5-coder:1.5b}
    entrypoint: [ "sh", "-c", "ollama pull ${M5_OLLAMA_MODEL:-qwen2.5-coder:1.5b}" ]
    depends_on:
      - ollama

  #  Project M5 FastAPI Backend API (Custom Port 18000)
  m5-backend:
    build: ../backend
    image: ${M5_IMAGE:-lazyserp/m5-backend:v1.0}
    container_name: M5-backend
    restart: always
    ports:
      - "18000:8000"
    env_file:
      - .env
    environment:
      - M5_QDRANT_HOST=qdrant
      - M5_QDRANT_PORT=6333
      - M5_OLLAMA_BASE_URL=http://ollama:11434
      - M5_OLLAMA_MODEL=${M5_OLLAMA_MODEL:-qwen2.5-coder:1.5b}
      - M5_WORKSPACE_ROOT=/app/workspace
    volumes:
      - "${TARGET_CODEBASE:-.}:/app/workspace"
      - "../backend/app:/app/app"
    depends_on:
      - qdrant
      - ollama

volumes:
  qdrant_storage:
  ollama_storage:
