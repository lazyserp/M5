version: '3.8'

services:
  # 1. Qdrant Persistent Vector Database (Custom Port 16333)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: m5-qdrant
    restart: always
    ports:
      - "16333:6333"
      - "16334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  # 2. Ollama Local LLM Model Engine (Custom Port 11435)
  ollama:
    image: ollama/ollama:latest
    container_name: m5-ollama
    restart: always
    ports:
      - "11435:11434"
    volumes:
      - ollama_storage:/root/.ollama

  # 3. Project M5 FastAPI Backend API (Custom Port 18000)
  m5-backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: m5-backend
    restart: always
    ports:
      - "18000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - qdrant
      - ollama

volumes:
  qdrant_storage:
  ollama_storage:
